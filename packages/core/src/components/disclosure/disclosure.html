<div class="u-disclosure-group">
  <div class="u-disclosure">
    <button class="u-disclosure__trigger" type="button" aria-expanded="false" aria-controls="delivery-details">
      <span class="u-disclosure__label">Delivery details</span>
      <svg class="u-disclosure__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
        <line class="u-disclosure__bar u-disclosure__bar--h" x1="5" y1="12" x2="19" y2="12" />
        <line class="u-disclosure__bar u-disclosure__bar--v" x1="12" y1="5" x2="12" y2="19" />
        <polyline class="u-disclosure__chev" points="6 9 12 15 18 9" />
      </svg>
    </button>
    <div class="u-disclosure__panel" id="delivery-details" role="region" aria-label="Delivery details">
      <div class="u-disclosure__inner">
        <p>We deliver Monday to Friday between 8:00 and 18:00. On the morning of delivery you get a text with a two-hour window.</p>
      </div>
    </div>
  </div>
  <div class="u-disclosure">
    <button class="u-disclosure__trigger" type="button" aria-expanded="false" aria-controls="returns">
      <span class="u-disclosure__label">Returns</span>
      <svg class="u-disclosure__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
        <line class="u-disclosure__bar u-disclosure__bar--h" x1="5" y1="12" x2="19" y2="12" />
        <line class="u-disclosure__bar u-disclosure__bar--v" x1="12" y1="5" x2="12" y2="19" />
        <polyline class="u-disclosure__chev" points="6 9 12 15 18 9" />
      </svg>
    </button>
    <div class="u-disclosure__panel" id="returns" role="region" aria-label="Returns">
      <div class="u-disclosure__inner">
        <p>Send anything back within 30 days, unused and in its box. The return label is in your order email.</p>
      </div>
    </div>
  </div>
</div>
